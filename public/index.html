<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>뱀 주사위 보드게임</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. 초기 진입 모달: 이름 입력 + 방 생성/입장 (start.png 아트워크를 그대로 카드로 사용) -->
<div id="nameModal" class="modal-overlay">
  <div class="entry-card">
    <input type="text" id="nameInput" maxlength="8" placeholder="이름을 입력하세요" autocomplete="off"
           class="art-field name-field">
    <button id="createRoomBtn" class="art-field create-field">새 방 만들기</button>
    <input type="text" id="roomCodeInput" maxlength="4" placeholder="방코드 4자리 입력" autocomplete="off" inputmode="numeric"
           class="art-field roomcode-field">
    <button id="joinRoomBtn" class="art-field join-field">참가하기</button>
  </div>
  <p id="modalError" class="error-text"></p>
  <p id="lastUpdated" class="last-updated"></p>
</div>

<!-- 2. 대기실 화면 -->
<div id="lobbyScreen" class="screen hidden">
  <div class="lobby-box">
    <h2>대기실</h2>
    <p class="room-code-label">방 코드</p>
    <p id="roomCodeDisplay" class="room-code"></p>

    <ul id="playerList" class="player-list"></ul>

    <button id="startGameBtn" class="btn btn-primary hidden">게임 시작</button>
    <p id="waitHostText" class="wait-text hidden">방장이 게임을 시작하기를 기다리는 중...</p>
  </div>
</div>

<!-- 3. 게임 화면 -->
<div id="gameScreen" class="screen hidden">
  <div class="top-bar">
    <div id="turnIndicator" class="turn-indicator">대기 중...</div>
    <div id="gameTimer" class="game-timer hidden">00:00</div>
    <button id="diceArea" type="button" class="dice-area" disabled title="주사위를 터치해 굴리세요">
      <div id="dice1" class="dice">-</div>
      <div id="dice2" class="dice">-</div>
    </button>
    <button id="muteBtn" class="mute-btn" title="소리 켜기/끄기">🔊</button>
  </div>

  <div id="boardWrap" class="board-wrap">
    <div id="board" class="board">
      <div id="tokenLayer" class="token-layer"></div>
    </div>
  </div>
</div>

<!-- 4-1. 재접속 확인 모달: 이전 세션이 남아있을 때 이어할지/새로 시작할지 선택 -->
<div id="resumeModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2>이전 게임이 있어요</h2>
    <p class="win-message">참여 중이던 게임을 이어서 할까요?</p>
    <button id="resumeBtn" class="btn btn-primary">이어하기</button>
    <button id="freshStartBtn" class="btn btn-secondary">새로 시작하기</button>
  </div>
</div>

<!-- 4. 승리 모달 -->
<div id="winModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2 id="winTitle" class="win-title">🎉 승리 🎉</h2>
    <p id="winMessage" class="win-message"></p>
    <ol id="rankList" class="rank-list"></ol>
    <button id="reloadBtn" class="btn btn-primary">다시 하기</button>
  </div>
</div>

<audio id="bgmAudio" src="mondamusic-retro-arcade-game-music-512837.mp3" loop preload="auto"></audio>

<script src="/socket.io/socket.io.js"></script>
<script src="main.js"></script>
</body>
</html>
